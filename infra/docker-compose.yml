services:
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    env_file: ../.env
    restart: unless-stopped
    ports:
      - "8080:8080"
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
volumes:
  redis_data:
